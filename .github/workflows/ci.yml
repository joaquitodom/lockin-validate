name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests cases/_generators
      - name: Tests
        run: uv run pytest
      - name: Benchmark battery
        run: uv run lockin-validate cases
      - name: Cases are reproducible
        shell: bash
        run: |
          for g in core_cases adversarial_cases lockin_style_case statistical_cases data_cases lessons_cases; do
            uv run python cases/_generators/$g.py > /dev/null
          done
          git add --renormalize cases && git diff --cached --exit-code --stat -- cases
